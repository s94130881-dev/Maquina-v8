name: RDP-Gaming-VM

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Windows Performance for Gaming & RDP
        run: |
          # Habilita Área de Trabalho Remota sem restrições de NLA
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Otimização (Prioriza programas/jogos em primeiro plano)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\PriorityControl' -Name "Win32PrioritySeparation" -Value 38 -Force

          # Habilita o Windows Audio Service (Evita crashes em jogos antigos como RE4)
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service -Name Audiosrv

          # Configura o Firewall do Windows para liberar o RDP
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          \$charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          \$rawPassword = @()
          rawPassword += charSet.Upper | Get-Random -Count 4
          rawPassword += charSet.Lower | Get-Random -Count 4
          rawPassword += charSet.Number | Get-Random -Count 4
          rawPassword += charSet.Special | Get-Random -Count 4
          password = -join (rawPassword | Sort-Object { Get-Random })
          securePass = ConvertTo-SecureString password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password \$securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASSWORD=password" >> env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale & Gaming Essentials
        run: |
          # Instalação do Tailscale via MSI silencioso
          \$tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          installerPath = "env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri tsUrl -OutFile installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

          # Instala DirectX e Visual C++ via Winget (Necessários para abrir o jogo)
          winget install --id Microsoft.VisualC++2015-2022Redistributable-x64 --silent --accept-source-agreements --accept-package-agreements
          winget install --id Microsoft.DirectX --silent --accept-source-agreements --accept-package-agreements

      - name: Establish Tailscale Connection
        run: |
          # Autentica e inicia o cliente do Tailscale
          & "\$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\({{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-gaming-runner-\)env:GITHUB_RUN_ID
          
          # Aguarda a atribuição do endereço de IP do Tailscale
          \$tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          
          if (-not \$tsIP) {
              Write-Error "Tailscale IP não atribuído."
              exit 1
          }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP obtido: \$env:TAILSCALE_IP"
          testResult = Test-NetConnection -ComputerName env:TAILSCALE_IP -Port 3389
          if (-not \$testResult.TcpTestSucceeded) {
              Write-Error "A conexão local com a porta 3389 falhou."
              exit 1
          }
          Write-Host "Porta 3389 aberta e escutando!"

      - name: Maintain Connection & Game Server Environment
        run: |
          Write-Host "`n======================================"
          Write-Host "=== DADOS DE ACESSO DA VM DE JOGOS ==="
          Write-Host "IP do Tailscale: $env:TAILSCALE_IP"
          Write-Host "Usuário RDP: RDP"
          Write-Host "Senha gerada: $env:RDP_PASSWORD"
          Write-Host "======================================`n"
          
          # Mantém o workflow em loop infinito para você jogar
          while (\$true) {
              Write-Host "[\$(Get-Date)] VM Online - Aguardando conexão para o jogo"
              Start-Sleep -Seconds 300
          }
